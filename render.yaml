# Blueprint de Render para railspec-server (servidor + consola web en un solo servicio).
# Guía: railspec/docs/despliegue-render.md. Render construye la imagen del Dockerfile del repositorio en cada
# push a master que toque el servidor, la consola o el Dockerfile: no hace falta GHCR, token de registro,
# Deploy Hook ni GitHub Actions. Estado en Supabase Postgres (RAILSPEC_POSTGRES_URL); el grafo en la misma base
# (RAILSPEC_GRAFO_POSTGRES). La variante con imagen publicada en GHCR está en railspec/deploy/render/render-ghcr.yaml.
#
# Los valores con `sync: false` se piden al crear el Blueprint en el panel de Render (nunca van en este
# archivo). Render ignora los `sync: false` al actualizar un Blueprint ya creado: cámbialos en el panel.
services:
  - type: web
    name: railspec
    runtime: docker
    dockerfilePath: ./railspec/deploy/servidor/Dockerfile
    dockerContext: .
    branch: master
    plan: free
    region: oregon
    healthCheckPath: /healthz
    # Despliega solo cuando cambia lo que entra en la imagen (la guía, el CI y los demás paquetes no).
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - railspec/packages/railspec-contracts/**
        - railspec/packages/railspec-graph/**
        - railspec/packages/railspec-server/**
        - railspec/packages/railspec-console/**
        - railspec/deploy/servidor/**
    envVars:
      - key: RAILSPEC_PUERTO
        value: "10000"
      # Render pone el proxy delante: uvicorn confía en X-Forwarded-* de cualquier origen. Un cliente puede
      # falsear su IP y esquivar el límite de /consola/api/auth/*; ver railspec/docs/despliegue-render.md.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # --- estado (Supabase) ---
      - key: RAILSPEC_POSTGRES_URL
        sync: false
      - key: RAILSPEC_POSTGRES_ESQUEMA
        value: railspec
      # El grafo de código vive en esa misma base (tablas grafo_*), sin FalkorDB: habilita graph.query,
      # graph.index, el impacto del gate y la rebanada de grafo de spec, plan y tasks.
      - key: RAILSPEC_GRAFO_POSTGRES
        value: "true"
      # --- reindexado del grafo desde CI (graph.index con OIDC de GitHub Actions) ---
      # Los dos vacíos desactivan graph.index; con uno solo definido el servidor no arranca.
      - key: RAILSPEC_OIDC_AUDIENCIA
        sync: false
      - key: RAILSPEC_OIDC_REPOSITORIOS
        sync: false
      # --- consola web ---
      # La URL pública sale de RENDER_EXTERNAL_URL (la fija Render); define RAILSPEC_CONSOLA_URL en el panel
      # solo si usas un dominio propio.
      - key: RAILSPEC_CONSOLA_SECRETO
        generateValue: true
      - key: RAILSPEC_CONSOLA_ADMINS
        value: "83125327"
      - key: RAILSPEC_GITHUB_APP_CLIENT_ID
        sync: false
      - key: RAILSPEC_GITHUB_APP_CLIENT_SECRET
        sync: false
      # Opcionales, juntas: con ellas la consola abre PR para editar contexto.yaml y .railspecignore.
      - key: RAILSPEC_GITHUB_APP_ID
        sync: false
      - key: RAILSPEC_GITHUB_APP_CLAVE_PRIVADA
        sync: false
      # --- modelos (Azure AI Foundry) ---
      - key: RAILSPEC_FOUNDRY_ENDPOINT
        sync: false
      - key: RAILSPEC_FOUNDRY_API_KEY
        sync: false
      - key: RAILSPEC_FOUNDRY_REGION
        sync: false
      - key: RAILSPEC_FOUNDRY_ZONA_DATOS
        sync: false
      - key: RAILSPEC_FOUNDRY_DESPLIEGUES
        sync: false
      # --- suscripciones de modelos (consola) ---
      # Clave maestra que cifra las claves de las suscripciones. Genérala con `openssl rand -base64 32` y
      # guárdala fuera de Render: sin ella las claves guardadas no se pueden descifrar.
      - key: RAILSPEC_CLAVE_MAESTRA
        sync: false
      # Bearer de GET /metrics (16 caracteres o más, p. ej. `openssl rand -base64 24`). Sin él no hay
      # endpoint de métricas. Ver docs/despliegue.md#esquema-del-estado-y-métricas.
      - key: RAILSPEC_METRICAS_TOKEN
        sync: false
