[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "railspec-local"
version = "0.1.0"
description = "Proxy MCP local de Railspec (fase 3): worktree por unidad, snapshots y cola sin conexión."
requires-python = ">=3.11"
dependencies = ["railspec-contracts==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["railspec.local*"]
namespaces = true
