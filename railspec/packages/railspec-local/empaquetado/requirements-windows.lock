# en Linux (bloquear.sh) y descarta los requisitos con marcador sys_platform == "win32". Se instala después
# de requirements.lock, solo en Windows:
#
#    pip install --require-hashes --no-deps -r requirements.lock -r requirements-windows.lock
#
# Se mantiene a mano: las versiones son las mínimas que piden pyinstaller (pefile, pywin32-ctypes) y mcp
# (pywin32>=311); los hashes son los sha256 de todos los archivos publicados de cada versión en PyPI
# (https://pypi.org/pypi/<paquete>/<versión>/json, campo urls[].digests.sha256). Al subir pyinstaller o mcp
# en requirements.in, revisar aquí sus requisitos con marcador win32.
#
