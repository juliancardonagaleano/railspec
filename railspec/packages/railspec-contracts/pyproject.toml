[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "railspec-contracts"
version = "0.1.0"
description = "Contratos versionados de Railspec: orden de trabajo, tools, snapshot, eventos, estado, insumo y chat."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["railspec.contracts*"]
namespaces = true
