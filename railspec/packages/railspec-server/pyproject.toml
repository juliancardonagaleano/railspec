[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "railspec-server"
version = "0.1.0"
description = "Motor remoto de Railspec (fase 2): DAG sobre Microsoft Agent Framework, API MCP y HTTP."
requires-python = ">=3.11"
dependencies = ["railspec-contracts==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["railspec.server*"]
namespaces = true
