[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "railspec-server"
version = "0.1.0"
description = "Motor remoto de Railspec (fase 2): DAG sobre Microsoft Agent Framework, API MCP y HTTP."
requires-python = ">=3.11"
dependencies = [
  "railspec-contracts==0.1.0",
  "agent-framework-core>=1.19,<2",
]

[project.optional-dependencies]
# Motor en producción: Mongo, proveedores de modelo y superficies MCP/HTTP.
motor = [
  "pymongo>=4.8,<5",
  "agent-framework-anthropic>=1.0.0b260918",
  "agent-framework-foundry>=1.13",
  "azure-identity>=1.19",
  "mcp>=2.2,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
# Grafo central (FalkorDB) para el impacto en el gate de código.
grafo = ["railspec-graph==0.1.0"]
test-motor = [
  "pytest>=8",
  "mongomock>=4.3",
  "httpx>=0.27",
  "mcp>=2.2,<3",
  "fastapi>=0.115",
  "pymongo>=4.8,<5",
]

[project.scripts]
railspec-server = "railspec.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["railspec.server*"]
namespaces = true
