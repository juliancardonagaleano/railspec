[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "railspec-server"
version = "0.1.0"
description = "Motor remoto de Railspec (fase 2): DAG sobre Microsoft Agent Framework, API MCP y HTTP."
requires-python = ">=3.11"
dependencies = [
  "railspec-contracts==0.1.0",
  "agent-framework-core>=1.19,<2",
]

[project.optional-dependencies]
# Motor en producción: Mongo (o Postgres, ver estado/postgres.py), proveedores de modelo y superficies MCP/HTTP.
motor = [
  "pymongo>=4.8,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "agent-framework-anthropic>=1.0.0b260918",
  "agent-framework-foundry>=1.13",
  # SDK oficiales de los adaptadores de proveedor (Claude por Messages API, resto por chat completions).
  "anthropic>=0.116",
  "openai>=3.22",
  "httpx>=0.27",
  "azure-identity>=1.19",
  "mcp>=2.2,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # Tokens OIDC de GitHub Actions (actor de servicio de graph.index).
  "pyjwt[crypto]>=2.8,<3",
  # contexto.yaml: la consola lo valida antes de proponerlo como PR.
  "pyyaml>=6",
]
# Grafo central (FalkorDB) para el impacto en el gate de código.
grafo = ["railspec-graph==0.1.0"]
test-motor = [
  "pytest>=8",
  "mongomock>=4.3",
  "httpx>=0.27",
  "mcp>=2.2,<3",
  "fastapi>=0.115",
  "pymongo>=4.8,<5",
  "psycopg[binary,pool]>=3.2,<4",
  "pyjwt[crypto]>=2.8,<3",
  "pyyaml>=6",
  "railspec-graph==0.1.0",
]

[project.scripts]
railspec-server = "railspec.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["railspec.server*"]
namespaces = true
