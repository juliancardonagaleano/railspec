# Con RAILSPEC_AZURE_CLIENT_ID, Foundry se autentica por Workload Identity
# (Entra ID, sin clave). Sin él, la anotación queda vacía y no se usa.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: railspec-server
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-server
    app.kubernetes.io/part-of: railspec
  annotations:
    azure.workload.identity/client-id: "${RAILSPEC_AZURE_CLIENT_ID}"
automountServiceAccountToken: false
