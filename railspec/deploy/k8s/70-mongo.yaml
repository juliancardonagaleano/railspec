# Mongo 7 dentro del clúster (RAILSPEC_MONGO_INTERNO=true). Un solo nodo con autenticación y el
# volumen persistente en un PVC por volumeClaimTemplates; sin conjunto de réplicas (no hay alta
# disponibilidad: ver railspec/docs/despliegue-datos.md). Las credenciales van por referencia al
# Secret ${RAILSPEC_DATOS_SECRETO}, que se crea aparte; aquí solo se nombran sus claves.
#
# La imagen de Mongo ejecuta los .js de /docker-entrypoint-initdb.d solo al inicializar un volumen
# vacío: crea el usuario de la aplicación con readWrite sobre ${RAILSPEC_MONGO_DB} y nada más. El
# usuario raíz queda para los respaldos y la administración; el servidor nunca lo usa.
apiVersion: v1
kind: ConfigMap
metadata:
  name: railspec-mongo-init
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-mongo
    app.kubernetes.io/component: datos
    app.kubernetes.io/part-of: railspec
data:
  10-usuario-aplicacion.js: |
    const bd = process.env.RAILSPEC_MONGO_DB;
    db.getSiblingDB(bd).createUser({
      user: "railspec",
      pwd: process.env.RAILSPEC_MONGO_CLAVE,
      roles: [{ role: "readWrite", db: bd }],
    });
---
apiVersion: v1
kind: Service
metadata:
  name: railspec-mongo
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-mongo
    app.kubernetes.io/component: datos
    app.kubernetes.io/part-of: railspec
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: railspec-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: railspec-mongo
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-mongo
    app.kubernetes.io/component: datos
    app.kubernetes.io/part-of: railspec
spec:
  serviceName: railspec-mongo
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: railspec-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railspec-mongo
        app.kubernetes.io/component: datos
        app.kubernetes.io/part-of: railspec
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: ${RAILSPEC_MONGO_IMAGEN}
          imagePullPolicy: IfNotPresent
          # --auth ya lo añade la imagen con MONGO_INITDB_ROOT_*; se deja explícito a propósito.
          args: ["mongod", "--bind_ip_all", "--auth"]
          ports:
            - name: mongo
              containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${RAILSPEC_DATOS_SECRETO}
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${RAILSPEC_DATOS_SECRETO}
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: RAILSPEC_MONGO_CLAVE
              valueFrom:
                secretKeyRef:
                  name: ${RAILSPEC_DATOS_SECRETO}
                  key: RAILSPEC_MONGO_CLAVE
            - name: RAILSPEC_MONGO_DB
              value: "${RAILSPEC_MONGO_DB}"
          # ``ping`` no exige autenticación. mongosh tarda un segundo en arrancar: sondas espaciadas.
          startupProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: ${RAILSPEC_MONGO_MEMORIA}
            limits:
              memory: ${RAILSPEC_MONGO_MEMORIA}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdb
              mountPath: /data/configdb
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: configdb
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: init
          configMap:
            name: railspec-mongo-init
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: railspec-mongo
          app.kubernetes.io/component: datos
          app.kubernetes.io/part-of: railspec
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ${RAILSPEC_DATOS_CLASE}
        resources:
          requests:
            storage: ${RAILSPEC_MONGO_TAMANO}
