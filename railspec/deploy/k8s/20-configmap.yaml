# Configuración no secreta. Los secretos van en el Secret ${RAILSPEC_SECRETO},
# que se crea aparte (ver railspec/docs/despliegue.md); aquí solo se nombra.
apiVersion: v1
kind: ConfigMap
metadata:
  name: railspec-server
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-server
    app.kubernetes.io/part-of: railspec
data:
  RAILSPEC_MONGO_DB: "${RAILSPEC_MONGO_DB}"
  RAILSPEC_FOUNDRY_ENDPOINT: "${RAILSPEC_FOUNDRY_ENDPOINT}"
  # Región y zona de datos del recurso: deciden qué despliegues sirven a restringido
  # e interno (ver railspec/docs/proveedores.md).
  RAILSPEC_FOUNDRY_REGION: "${RAILSPEC_FOUNDRY_REGION}"
  RAILSPEC_FOUNDRY_ZONA_DATOS: "${RAILSPEC_FOUNDRY_ZONA_DATOS}"
  RAILSPEC_FOUNDRY_PROYECTO: "${RAILSPEC_FOUNDRY_PROYECTO}"
  # Forma compacta despliegue=modelo[:SKU],…; la lista JSON no cabe entre comillas dobles.
  RAILSPEC_FOUNDRY_DESPLIEGUES: "${RAILSPEC_FOUNDRY_DESPLIEGUES}"
  RAILSPEC_CATALOGO_TTL_S: "${RAILSPEC_CATALOGO_TTL_S}"
  RAILSPEC_CACHE_NODOS_S: "${RAILSPEC_CACHE_NODOS_S}"
  RAILSPEC_PCE_URL: "${RAILSPEC_PCE_URL}"
  RAILSPEC_CONTEXTO_CACHE_S: "${RAILSPEC_CONTEXTO_CACHE_S}"
  RAILSPEC_ANTHROPIC_HABILITADO: "${RAILSPEC_ANTHROPIC_HABILITADO}"
  # Identidad de servicio de CI para graph.index. Audiencia vacía = OIDC desactivado.
  RAILSPEC_OIDC_AUDIENCIA: "${RAILSPEC_OIDC_AUDIENCIA}"
  RAILSPEC_OIDC_EMISOR: "${RAILSPEC_OIDC_EMISOR}"
  RAILSPEC_OIDC_REPOSITORIOS: "${RAILSPEC_OIDC_REPOSITORIOS}"
  # Consola web: base pública de la redirección de OAuth de la GitHub App y
  # administradores de la plataforma. Client id/secret de la App y
  # RAILSPEC_CONSOLA_SECRETO (obligatoria, mínimo 32 caracteres) van en el Secret (ver
  # railspec/docs/consola.md).
  RAILSPEC_CONSOLA_URL: "https://${RAILSPEC_DOMINIO}"
  RAILSPEC_CONSOLA_ADMINS: "${RAILSPEC_CONSOLA_ADMINS}"
  RAILSPEC_HOST: "0.0.0.0"
  RAILSPEC_PUERTO: "8080"
  # uvicorn confía en X-Forwarded-* del ingress (esquema https en redirecciones).
  # "*" confía en cualquier origen: el cliente puede falsear su IP (evade el límite de
  # /consola/api/auth/*). Sustituir por el CIDR de los pods del ingress; ver despliegue.md.
  FORWARDED_ALLOW_IPS: "*"
