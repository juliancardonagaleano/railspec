# FalkorDB dentro del clúster (RAILSPEC_FALKORDB_INTERNO=true): el grafo central y los vectores.
# Un solo nodo con contraseña, persistencia AOF (everysec) y el volumen en un PVC por
# volumeClaimTemplates. La imagen corre como root por defecto: aquí corre con un uid sin privilegios,
# la raíz en solo lectura y el navegador web de FalkorDB (puerto 3000) apagado. La contraseña va por
# referencia al Secret ${RAILSPEC_DATOS_SECRETO}; debe ser alfanumérica (``openssl rand -hex 24``) porque
# la imagen reparte REDIS_ARGS por espacios y la URL del servidor la lleva sin codificar.
apiVersion: v1
kind: Service
metadata:
  name: railspec-falkordb
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-falkordb
    app.kubernetes.io/component: datos
    app.kubernetes.io/part-of: railspec
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: railspec-falkordb
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: railspec-falkordb
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-falkordb
    app.kubernetes.io/component: datos
    app.kubernetes.io/part-of: railspec
spec:
  serviceName: railspec-falkordb
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: railspec-falkordb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railspec-falkordb
        app.kubernetes.io/component: datos
        app.kubernetes.io/part-of: railspec
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: falkordb
          image: ${RAILSPEC_FALKORDB_IMAGEN}
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          # $(VAR) lo expande el kubelet con las variables definidas antes en esta lista.
          env:
            - name: FALKORDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${RAILSPEC_DATOS_SECRETO}
                  key: FALKORDB_PASSWORD
            # redis-cli lo lee: las sondas y los respaldos no llevan la contraseña en la línea de comandos.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: ${RAILSPEC_DATOS_SECRETO}
                  key: FALKORDB_PASSWORD
            - name: REDIS_ARGS
              value: "--requirepass $(FALKORDB_PASSWORD) --appendonly yes --appendfsync everysec"
            - name: BROWSER
              value: "0"
          startupProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: ${RAILSPEC_FALKORDB_MEMORIA}
            limits:
              memory: ${RAILSPEC_FALKORDB_MEMORIA}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/falkordb/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: railspec-falkordb
          app.kubernetes.io/component: datos
          app.kubernetes.io/part-of: railspec
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ${RAILSPEC_DATOS_CLASE}
        resources:
          requests:
            storage: ${RAILSPEC_FALKORDB_TAMANO}
