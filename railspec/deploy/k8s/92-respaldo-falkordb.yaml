# Respaldo de FalkorDB (RAILSPEC_RESPALDO y RAILSPEC_FALKORDB_INTERNO): instantánea RDB por la
# replicación (redis-cli --rdb), que incluye los grafos, a /respaldo/falkordb. La contraseña llega
# por REDISCLI_AUTH desde el Secret. Mismo ciclo que el de Mongo: temporal, comprobación y retención.
# El grafo se puede reconstruir reindexando los repositorios, pero tarda; el respaldo evita esa espera.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: railspec-respaldo-falkordb
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-respaldo
    app.kubernetes.io/component: datos
    app.kubernetes.io/part-of: railspec
spec:
  schedule: "${RAILSPEC_RESPALDO_CRON}"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: railspec-respaldo
            app.kubernetes.io/component: datos
            app.kubernetes.io/part-of: railspec
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            fsGroup: 10002
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: redis-cli
              image: ${RAILSPEC_FALKORDB_IMAGEN}
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ceu"]
              args:
                - |
                  destino=/respaldo/falkordb
                  mkdir -p "$destino"
                  archivo="$destino/railspec-$(date -u +%Y%m%dT%H%M%SZ).rdb"
                  redis-cli -h railspec-falkordb -p 6379 --rdb "$archivo.tmp"
                  test -s "$archivo.tmp"
                  mv "$archivo.tmp" "$archivo"
                  find "$destino" -name 'railspec-*.rdb.tmp' -mtime +1 -delete
                  find "$destino" -name 'railspec-*.rdb' -mtime +"$RETENCION_DIAS" -delete
                  ls -l "$archivo"
              env:
                - name: HOME
                  value: /tmp
                - name: RETENCION_DIAS
                  value: "${RAILSPEC_RESPALDO_RETENCION_DIAS}"
                - name: REDISCLI_AUTH
                  valueFrom:
                    secretKeyRef:
                      name: ${RAILSPEC_DATOS_SECRETO}
                      key: FALKORDB_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: respaldo
                  mountPath: /respaldo
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: respaldo
              persistentVolumeClaim:
                claimName: railspec-respaldo
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
