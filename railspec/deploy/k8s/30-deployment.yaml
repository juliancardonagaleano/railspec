apiVersion: apps/v1
kind: Deployment
metadata:
  name: railspec-server
  namespace: ${RAILSPEC_NAMESPACE}
  labels:
    app.kubernetes.io/name: railspec-server
    app.kubernetes.io/part-of: railspec
spec:
  replicas: ${RAILSPEC_REPLICAS}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: railspec-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: railspec-server
        app.kubernetes.io/part-of: railspec
        azure.workload.identity/use: "${RAILSPEC_WORKLOAD_IDENTITY}"
    spec:
      serviceAccountName: railspec-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: railspec-server
      terminationGracePeriodSeconds: 30
      containers:
        - name: railspec-server
          image: ${RAILSPEC_IMAGEN}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: railspec-server
            # Claves: RAILSPEC_MONGO_URI (obligatoria), RAILSPEC_FALKORDB_URL,
            # RAILSPEC_FOUNDRY_API_KEY, RAILSPEC_PCE_API_KEY, RAILSPEC_ANTHROPIC_API_KEY,
            # RAILSPEC_CLAVE_MAESTRA (cifra las claves de las suscripciones de modelos de la consola),
            # RAILSPEC_METRICAS_TOKEN (opcional: Bearer de GET /metrics, 16 caracteres o más),
            # RAILSPEC_CONSOLA_SECRETO (obligatoria, mínimo 32 caracteres: con la URL https del
            # ConfigMap el servidor no arranca sin ella), RAILSPEC_GITHUB_APP_CLIENT_ID/_SECRET (consola).
            - secretRef:
                name: ${RAILSPEC_SECRETO}
          # Modo desarrollo apagado por construcción: ``env`` gana a ``envFrom``, así que una clave
          # sobrante en el Secret (RAILSPEC_TOKENS_DESARROLLO, RAILSPEC_PERMITIR_DESARROLLO) no
          # puede activar los tokens de desarrollo ni el modo en memoria en AKS. No quitar.
          env:
            - name: RAILSPEC_PERMITIR_DESARROLLO
              value: ""
            - name: RAILSPEC_TOKENS_DESARROLLO
              value: ""
          # /livez: el proceso atiende. /healthz: además Mongo y FalkorDB responden
          # (503 si no). Una caída de la base saca la réplica del Service sin reiniciarla.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: ${RAILSPEC_CPU_SOLICITUD}
              memory: ${RAILSPEC_MEMORIA}
            limits:
              memory: ${RAILSPEC_MEMORIA}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Clones del chat (``code.read``), de solo lectura. Sin RAILSPEC_CHAT_CLONES_PVC el
            # volumen es un emptyDir vacío y el servidor no recibe la ruta (ver 20-configmap.yaml).
            - name: clones
              mountPath: ${RAILSPEC_CHAT_CLONES_RUTA}
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: clones
          ${RAILSPEC_CHAT_CLONES_VOLUMEN}
