  - source: scripts/install_pre_push_hook.sh
    dest: scripts/install_pre_push_hook.sh

  # --- Output styles del agente (CA-44) -----------------------------
  - source: .claude/output-styles
    dest: .claude/output-styles

  # --- Configuración de Claude Code (cableado por fusión con marcador) --
  # Esta entrada es **especial**: no es una entrada común de la carga.
  # El instalador lee `.claude/settings.json` del kit, identifica sus
  # entries de hook marcadas con `_sdd_kit: true`, y las fusiona con las
  # del destino preservando contenido ajeno (CA-45..CA-47). El archivo
  # sí se escribe en el worktree, pero no se copia byte a byte.
  - source: .claude/settings.json
    dest: .claude/settings.json

