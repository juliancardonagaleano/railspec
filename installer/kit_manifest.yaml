  # --- Configuración del entorno (Claude + Opencode, fusión con marcador) ---
  # Esta carga es **única**: en el destino el instalador la fusiona con
  # marcador (no la copia byte a byte) salvo `AGENTS.md` y `mcp-pce.sh`,
  # que viajan como carga ordinaria. Cobertura doble: Claude y Opencode
  # apuntan a la misma herramienta (`scripts/mcp-pce.sh`). Si una de las
  # dos entradas JSON falta, el install aborta con código 2 (no 3, no
  # drift) — CA-55. Ver `plan.md` § Decisiones para la forma del marcador.
  #
  # - `.mcp.json` se fusiona con marcador en entries de `mcpServers`
  #   (CA-51), discriminador `_sdd_kit: true` por server.
  # - `opencode.jsonc` se fusiona con marcador en entries de `mcp` (CA-52),
  #   mismo discriminador, sintaxis JSONC.
  # - `AGENTS.md` es prosa de gobernanza que viaja como carga (overwrite,
  #   no fusión — CA-53). El destino puede agregar prosa local sin que el
  #   kit la pise (decisión a tomar en `0002`).
  - source: .mcp.json
    dest: .mcp.json
  - source: opencode.jsonc
    dest: opencode.jsonc
  - source: AGENTS.md
    dest: AGENTS.md

  # --- Launcher del MCP pce-mcp (carga para que el destino tenga el ------
  # script que invocan los configs anteriores). El cliente Python real vive
  # fuera del kit (lo provee la PCE); este loader solo lee credenciales
  # de `.env` y exec'a `scripts/mcp-pce.py` (CA-54). Si `mcp-pce.py` falta
  # en el destino, el config queda armado pero el hook falla en runtime
  # con mensaje claro — el install no aborta por ello.
  - source: scripts/mcp-pce.sh
    dest: scripts/mcp-pce.sh

  # --- scripts/ de nivel superior (materializadores, huérfano kit_doctor.py, --
  # --- instalador del gancho de pre-push) --------------------------------
  - source: scripts/kit_doctor.py
    dest: scripts/kit_doctor.py
  - source: scripts/materialize_claude_agents.py
    dest: scripts/materialize_claude_agents.py
