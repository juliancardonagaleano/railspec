# Manifiesto de la carga del kit. Cada entrada declara un par
# (origen en este repositorio, destino relativo al repositorio de instalación).
# Editado a mano — no lo escribe ningún materializador.
#
# Cobertura: todo archivo marcado `viaja` en `docs/inventario-extraccion.yaml`
# (CA-03) figura aquí; ningún `no-viaja` figura — verificado mecánicamente por
# `installer/tests/test_manifest_matches_inventory.py` (CA-17), no a mano.
# Las entradas que van más allá del inventario (`.agents/`, `.spec/perfiles.yaml`,
# `.spec/_plantillas/`, `.spec/_fixtures/`, `scripts/`, la prosa normativa) no
# están restringidas por esa comparación — el inventario solo cubre
# `.spec/scripts/*.py`/`*.sh` de nivel superior — y son necesarias para que el
# destino reciba un protocolo funcional completo, no solo esos scripts.
#
# `.spec/protocolo-datos.yaml` NO figura aquí a propósito: es configuración
# propia de cada destino (modelos/perfiles permitidos, subárboles de test),
# nunca parte de la carga que el kit sobrescribe.
#
# `kit_version:` es la **única fuente de versión** del kit (CA-01). Un test
# falla si la cadena aparece declarada en cualquier otro archivo de datos
# del repo (CA-43). El instalador la expone vía `--version` (CA-02) y la
# persiste en el registro de instalación del destino (CA-03).
kit_version: "0.1.0"
