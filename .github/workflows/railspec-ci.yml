# CI de Railspec: lint, pruebas de cada paquete por separado (cada uno con
# solo sus dependencias) y validación de lo desplegable. Sustituye al antiguo
# railspec-contratos.yml. Corre también las pruebas del instalador del kit
# (installer/tests), que incluyen la convivencia del kit con Railspec.
#
# codebase-memory-mcp nunca se instala suelto: se fija a railspec.local.indexador_cbm.VERSION_FIJA
# con el paso "Indexador fijado" (mismo patrón que railspec-binario.yml). Una prueba de
# railspec/deploy/tests falla si un workflow lo instala sin pin o con otra versión.
name: railspec-ci

on:
  pull_request:
    paths: ["railspec/**", "installer/**", ".github/workflows/railspec-*.yml"]
  push:
    branches: [master]
    paths: ["railspec/**", "installer/**", ".github/workflows/railspec-*.yml"]

permissions:
  contents: read

concurrency:
  group: railspec-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check --config railspec/pyproject.toml railspec
      - run: ruff format --config railspec/pyproject.toml --check railspec

  pruebas:
    name: pruebas (${{ matrix.paquete }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Las pruebas de railspec-contracts viven en railspec/tests.
          - paquete: railspec-contracts
            instalar: -e "railspec/packages/railspec-contracts[test]"
            pruebas: railspec/tests
            falkordb: false
            indexador: false
          - paquete: railspec-graph
            instalar: -e railspec/packages/railspec-contracts -e "railspec/packages/railspec-graph[falkordb,test]"
            pruebas: railspec/packages/railspec-graph
            falkordb: true
            indexador: false
          - paquete: railspec-server
            instalar: >-
              -e railspec/packages/railspec-contracts -e "railspec/packages/railspec-graph[falkordb]"
              -e "railspec/packages/railspec-server[motor,grafo,test-motor]"
            pruebas: railspec/packages/railspec-server
            falkordb: true
            indexador: false
          - paquete: railspec-local
            instalar: -e railspec/packages/railspec-contracts -e railspec/packages/railspec-local pytest
            pruebas: railspec/packages/railspec-local
            falkordb: false
            indexador: true
          - paquete: despliegue
            instalar: -e railspec/packages/railspec-contracts -e railspec/packages/railspec-local pytest pyyaml
            pruebas: railspec/deploy/tests
            falkordb: false
            indexador: false
          # Las pruebas del instalador del kit viven en installer/tests. test_convivencia_railspec.py
          # instala el kit y `railspec instalar` en repositorios temporales y necesita railspec-local.
          - paquete: installer
            instalar: -e railspec/packages/railspec-contracts -e railspec/packages/railspec-local pytest pyyaml
            pruebas: installer/tests
            falkordb: false
            indexador: false
    services:
      falkordb:
        # Misma versión y digest que railspec/deploy/renderizar.py (IMAGEN_FALKORDB).
        image: falkordb/falkordb:6.0.1@sha256:e2765e207e5ba4ee90e47ed31eb7491ad6dd3d42241c326e429375c02ad9882f
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: python -m pip install ${{ matrix.instalar }}
      - name: Indexador fijado (codebase-memory-mcp)
        if: matrix.indexador
        run: |
          python -m pip install "codebase-memory-mcp==$(python -m railspec.local.indexador_cbm)"
          python -m railspec.local.indexador_cbm --verificar
      - name: Configurar git para las pruebas que crean repositorios
        run: |
          git config --global user.email "ci@railspec.invalid"
          git config --global user.name "railspec-ci"
          git config --global init.defaultBranch master
      - name: Probar
        env:
          RAILSPEC_FALKORDB_URL: ${{ matrix.falkordb && 'redis://localhost:6379' || '' }}
        run: python -m pytest -c railspec/pyproject.toml --rootdir railspec ${{ matrix.pruebas }}

  integracion:
    name: integración extremo a extremo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Recorrido completo de railspec/integracion contra Mongo y FalkorDB reales, con el servidor en un
    # subproceso. Las imágenes son las de railspec/deploy/renderizar.py (IMAGEN_MONGO e IMAGEN_FALKORDB).
    services:
      mongo:
        image: mongo:7.0.43@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s --health-timeout 10s --health-retries 20
      falkordb:
        image: falkordb/falkordb:6.0.1@sha256:e2765e207e5ba4ee90e47ed31eb7491ad6dd3d42241c326e429375c02ad9882f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: >-
          python -m pip install
          -e "railspec/packages/railspec-contracts[test]" -e railspec/packages/railspec-local
          -e "railspec/packages/railspec-graph[falkordb]"
          -e "railspec/packages/railspec-server[motor,grafo]"
          pytest pyyaml
      - name: Indexador fijado (codebase-memory-mcp)
        run: |
          python -m pip install "codebase-memory-mcp==$(python -m railspec.local.indexador_cbm)"
          python -m railspec.local.indexador_cbm --verificar
      - name: Configurar git para las pruebas que crean repositorios
        run: |
          git config --global user.email "ci@railspec.invalid"
          git config --global user.name "railspec-ci"
          git config --global init.defaultBranch master
      - name: Probar
        run: |
          set -o pipefail
          python -m pytest -c railspec/pyproject.toml --rootdir railspec -rs railspec/integracion | tee "$RUNNER_TEMP/e2e.txt"
          # Sin bases las pruebas se saltan en silencio y el job saldría en verde sin probar nada.
          if grep -q "no responde en" "$RUNNER_TEMP/e2e.txt"; then
            echo "::error::Mongo o FalkorDB no respondieron: la integración se saltó"
            exit 1
          fi

  consola:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: railspec/packages/railspec-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: railspec/packages/railspec-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  manifiestos:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM: "0.7.0"
    steps:
      - uses: actions/checkout@v4
      - name: Instalar kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: Renderizar y validar contra el esquema de Kubernetes
        env:
          RAILSPEC_IMAGEN: registro.azurecr.io/railspec-server:ci
          RAILSPEC_DOMINIO: railspec.example.com
          RAILSPEC_TLS_SECRETO: railspec-tls
        run: |
          python3 railspec/deploy/renderizar.py > "$RUNNER_TEMP/railspec.yaml"
          kubeconform -strict -summary -kubernetes-version 1.31.0 "$RUNNER_TEMP/railspec.yaml"
      - name: Renderizar con todo lo opcional activado (bases, red, respaldos y clones)
        env:
          RAILSPEC_IMAGEN: registro.azurecr.io/railspec-server:ci
          RAILSPEC_DOMINIO: railspec.example.com
          RAILSPEC_TLS_SECRETO: railspec-tls
          RAILSPEC_MONGO_INTERNO: "true"
          RAILSPEC_FALKORDB_INTERNO: "true"
          RAILSPEC_RED_POLITICAS: "true"
          RAILSPEC_RESPALDO: "true"
          RAILSPEC_CHAT_CLONES_PVC: railspec-clones
          RAILSPEC_CLONES_CREAR_PVC: "true"
          RAILSPEC_CLONES_ACTUALIZAR: "true"
          RAILSPEC_CLONES_REPOSITORIOS: acme/api acme/web
          RAILSPEC_FOUNDRY_ZONA_DATOS: us
          RAILSPEC_CHAT_ZONA_DATOS: zona-us
        run: |
          python3 railspec/deploy/renderizar.py > "$RUNNER_TEMP/railspec-todo.yaml"
          kubeconform -strict -summary -kubernetes-version 1.31.0 "$RUNNER_TEMP/railspec-todo.yaml"
