# Reindexa el grafo canónico en cada push a la rama por defecto (contrato 1.1):
# codebase-memory-mcp calcula el delta en el runner y railspec/deploy/ci/reindexar.py
# lo sube por lotes a graph.index (HTTP) con un token OIDC de GitHub Actions
# como actor de servicio. El servidor nunca indexa ni calcula embeddings.
# Desde el contrato 1.5 declara en commits_cubiertos los commits de la rama que cada índice
# incorpora, para que el servidor retire solo las superposiciones de unidades ya cubiertas.
# Desde el contrato 1.10 manda en el último lote el resumen del contenido del commit, que el
# servidor compara con el canónico; cada lunes además corre un índice completo programado, que
# reemplaza lo acumulado por deltas y corrige cualquier divergencia sin trabajo manual.
#
# Variables del repositorio (Settings > Secrets and variables > Actions > Variables):
#   RAILSPEC_URL           URL base del servidor, sin /mcp (si falta, el job no corre)
#   RAILSPEC_ORGANIZACION  slug de la organización en Railspec
#   RAILSPEC_WORKSPACE     slug del workspace
#   RAILSPEC_REPOSITORIO   slug del repositorio vinculado (por defecto, el nombre del repo)
#   RAILSPEC_OIDC_AUDIENCIA audiencia que valida el servidor (obligatoria, sin valor por defecto:
#                          larga y no adivinable; la misma que RAILSPEC_OIDC_AUDIENCIA del servidor)
name: railspec-reindexar

on:
  push:
    branches: [master]
  # Índice completo semanal (lunes, 05:17 UTC; fuera de la hora en punto, que GitHub satura). Los
  # programados solo corren en la rama por defecto, y el job los filtra más abajo.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      completo:
        description: "Forzar índice completo"
        type: boolean
        default: false
      retirar_todas:
        description: "Índice completo sin declarar commits cubiertos: retira todas las superposiciones retenidas, también las varadas"
        type: boolean
        default: false

permissions:
  contents: read

# Los deltas se encadenan por commit: nunca dos a la vez ni cancelar uno a medias.
concurrency:
  group: railspec-reindexar
  cancel-in-progress: false

jobs:
  reindexar:
    # El programado exige además no ser un fork y tener las variables de OIDC: sin ellas fallaría
    # cada semana en silencio en lugar de no correr. El push conserva la condición de siempre.
    if: >-
      vars.RAILSPEC_URL != '' && github.ref == 'refs/heads/master' &&
      (github.event_name != 'schedule' || (
        github.event.repository.fork == false &&
        vars.RAILSPEC_OIDC_AUDIENCIA != '' &&
        vars.RAILSPEC_ORGANIZACION != '' &&
        vars.RAILSPEC_WORKSPACE != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar indexador
        # La versión fijada (VERSION_FIJA) es la misma con la que los proxies calculan sus deltas:
        # ids de símbolo y aristas salen del parser del binario y solo casan con esa versión.
        run: |
          python -m pip install -e railspec/packages/railspec-contracts -e railspec/packages/railspec-local
          python -m pip install "codebase-memory-mcp==$(python -m railspec.local.indexador_cbm)"
          python -m railspec.local.indexador_cbm --verificar
          codebase-memory-mcp --version
      - name: Reindexar
        env:
          ANTERIOR: ${{ github.event_name == 'push' && github.event.before || '' }}
          # El programado siempre es completo; el manual, si se pide.
          COMPLETO: ${{ github.event_name == 'schedule' || inputs.completo }}
          RETIRAR_TODAS: ${{ inputs.retirar_todas }}
          REPOSITORIO: ${{ vars.RAILSPEC_REPOSITORIO || github.event.repository.name }}
        run: |
          OPCIONES=()
          if [ "$COMPLETO" = "true" ]; then ANTERIOR=""; fi
          if [ "$RETIRAR_TODAS" = "true" ]; then ANTERIOR=""; OPCIONES+=(--sin-cobertura); fi
          python railspec/deploy/ci/reindexar.py "${OPCIONES[@]}" \
            --servidor "${{ vars.RAILSPEC_URL }}" \
            --org "${{ vars.RAILSPEC_ORGANIZACION }}" \
            --workspace "${{ vars.RAILSPEC_WORKSPACE }}" \
            --repositorio "$REPOSITORIO" \
            --rama "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --anterior "$ANTERIOR" \
            --audiencia "${{ vars.RAILSPEC_OIDC_AUDIENCIA }}" \
            --raiz "$GITHUB_WORKSPACE"
