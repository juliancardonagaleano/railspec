      Hallazgo nuevo (no cubierto por H1-H17). El validador de cadena de
      conversión de modo es, en su mayor parte, mecanismo genérico
      reutilizable, pero lleva una constante `CUTOFF_DATE = "2026-09-24"`
      (línea 71) que es el sujeto funcional de una cláusula de excepción
      (CA-08 de su propio docstring): exime de regularizar `modo_conversion`
      a unidades `supervisado` creadas *antes* de esa fecha concreta —una
      decisión de migración puntual de IArk, sin sentido en un destino nuevo
      que no comparte esa historia. A diferencia de
      `validate_protocol_drift.py`/`test_subset.py` (cuyo split mecanismo/
      datos ya tiene tarea dedicada, T4), ninguna tarea de esta unidad
      contempla editar este archivo para generalizar o retirar el cutoff —
      así que, tal como está, no cumple el criterio de agnosticismo y no
      viaja. Recomendación para trabajo futuro: si el kit necesita esta
      validación, requiere su propio split mecanismo/datos (cutoff como
      configuración de destino, análogo a R1) en una unidad aparte.
