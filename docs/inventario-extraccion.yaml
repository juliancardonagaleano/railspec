notas:
  - >
    Alcance de este inventario: solo los archivos de nivel superior de
    `.spec/scripts/` (`*.py`, `*.sh`), sin `.spec/scripts/tests/`,
    `.spec/scripts/usage/` ni `.spec/scripts/cli/` (subárboles, tratados
    aparte por tasks.md T3 — copiados en bloque, no clasificados archivo por
    archivo en este inventario).
  - >
    Corrección post-T2 (durante T3): `usage_report.py` se reclasificó de
    `viaja` a `no-viaja` — su cierre transitivo completo (`.spec/scripts/
    usage/`) resultó ser instrumentación reflexiva de IArk (unidad 0113), no
    andamiaje genérico; motivo completo en su propia entrada. `.spec/scripts/
    usage/` (fuente y tests) no viaja como consecuencia — a diferencia de
    `.spec/scripts/tests/`, que sí viaja completo.
  - >
    Los "huérfanos" citados en H7 (`kit_doctor.py`, `validate_mandate.py`,
    `test_subset.py`) están declarados `viaja`; `kit_doctor.py` vive bajo
    `scripts/` (fuera del alcance de este inventario, que es solo
    `.spec/scripts/`) y se cubre en el manifiesto de T7 directamente.
  - >
    Dos entradas (`test_subset.py`, `validate_protocol_drift.py`) viajan con
    edición prevista en tareas separadas del plan (T4); se anota para que
    quien construya el manifiesto (T7) no las confunda con una copia
    verbatim.
  - >
    `validate_mode_conversion.py` es la única entrada `no-viaja` que no
    estaba prevista por H1-H17 — hallazgo propio de este inventario (T2).
