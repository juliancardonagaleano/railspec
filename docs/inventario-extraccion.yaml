# Inventario de clasificación — extracción del kit SDD (CA-03)
#
# Cobertura: cada archivo .py/.sh de nivel superior de `.spec/scripts/` en el
# repositorio de origen (IArk), sin contar las subcarpetas `tests/`,
# `usage/` ni `cli/` (esas se tratan aparte, ver Notas). 42 archivos en total
# a la fecha de este inventario.
#
# Categoría:
#   viaja     — andamiaje genérico del protocolo SDD, agnóstico a IArk (puede
#               requerir edición posterior — split mecanismo/datos, renombrado
#               de literales — sin que eso lo excluya de viajar; esa edición
#               es trabajo de otra tarea de esta misma unidad, no de este
#               inventario).
#   no-viaja  — historia específica de IArk: el archivo referencia por
#               nombre, docstring o contenido un ID de unidad/plan SDD, una
#               fecha de decisión o un nombre propio de IArk *como sujeto
#               funcional* (no como nota de procedencia). Lleva motivo.
#
# Criterio de deslinde entre "menciona un ID en el docstring como procedencia"
# (no descalifica — casi todo el andamiaje documenta en qué unidad se creó o
# se tocó por última vez, práctica estándar del repo) y "el ID/fecha/nombre es
# el sujeto funcional del archivo" (descalifica — el archivo es inútil o
# incorrecto fuera de esa historia puntual). Ejemplo del primer caso:
# `instance_lock.py` dice "Unidad 0114 adds..." en su docstring pero su
# mecanismo (file locking) es reusable en cualquier destino. Ejemplo del
# segundo: `convertir_planes_0001b.py` --- su nombre y su lógica completa
# convierten artefactos de un plan concreto ya retirado.
#
# H1-H17 de `research.md` son el insumo de partida, no la lista cerrada
# (mandato de `plan.md`); este inventario cubre lo que el research no llegó a
# enumerar.

