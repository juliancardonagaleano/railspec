# Estado machine-readable de la unidad de trabajo. Fuente de verdad para la retoma.
id: 0004-purga-y-gitignore
titulo: "Purga de archivos de ruido y blindaje del .gitignore"

# --- Multi-colaborador (unidad 0098) ---
dueño: ""             # quien creó la unidad o a quien se le asignó explícitamente.
                      # Ante escritura concurrente de este archivo (dos colaboradores
                      # editando a la vez), gana la versión con `actualizado` más
                      # reciente; el otro colaborador reaplica sus cambios sobre esa
                      # base — mismo criterio que la resolución real de la colisión
                      # 0083/0084 (ver _plan-maestro.md § Changelog).
carril: ""            # servicio o subárbol que esta unidad toca — hoy uno de
                      # core | orchestrator | studio | sdd (protocolo). Ver
                      # _plan-maestro.md § Modelo de ejecución multi-agente para la
                      # regla de paralelismo entre carriles. Se re-declara contra los
                      # servicios `iark-*` cuando la unidad 0082 los materialice.

fase: done            # research | spec | plan | tasks | aprobacion | implement | done
                      #   research   = fase 0 opcional (investigación previa)
                      #   aprobacion = solo modo semi-autonomo: esperando el OK humano
                      #                del paquete antes de implementar
estado: completado   # en-progreso | bloqueado | completado
creado: "2026-09-29T05:48:00Z"
actualizado: "2026-09-29T12:00:00Z"
governance_refs: [ninguna-aplicable]   # sin superficie de gobernanza propia del kit; pce-mcp no se ejecuta contra este repo.
                       # Justificación ampliada en spec.md § Governance aplicable. Precedentes:
                       # 0001-versionado-y-actualizacion-del-kit/spec.md:78-97 y
                       # 0003-fiabilidad-de-gates-de-gobernanza/spec.md:321.
                      # Si de verdad no aplica ninguno: [ninguna-aplicable], con la
                      # justificación en la tabla del spec. La lista vacía significa
                      # "sin consultar", y el gate del spec la rechaza.
comando_validacion: "python3 -m pytest installer -q && python3 scripts/kit_doctor.py" # CA-07 + CA-08 del spec

# --- SDD v2 ---
# Campos nuevos. A una unidad v1 (sin ellos) se le aplican estos mismos
# defaults al retomar: modo=interactivo, riesgo=medio, gates={}.

modo: semi-autonomo  # interactivo | semi-autonomo | supervisado | desatendido
                      #   interactivo   = el humano co-diseña; se pausa tras spec y tras plan.
                      #   semi-autonomo = spec/plan/tasks sin intervención; UN checkpoint
                      #                humano antes de implementar (paquete de aprobación).
                      #   supervisado   = solo válido junto con `mandato` (ver el bloque al
                      #                pie de este archivo); un plan maestro o una unidad
                      #                aislada corre fase a fase sin checkpoints intermedios,
                      #                con decisiones delegadas y paradas tipificadas.
                      #   desatendido   = tanda de unidades con 1 paquete de aprobación
                      #                upfront; sin checkpoints intermedios; gates que
                      #                escalan cierran como auto-deferred.
#                Ver .spec/MODELO-AGENTES.md § Modo desatendido
#                (0031, 2026-09-23) — formato de tanda y de paradas
#                tipificadas; la auditoría de modelo/effort por unidad
#                vive en § Auditoría de modelo/effort.

riesgo: bajo          # bajo | medio | alto — asignado en el triaje. Dimensiona los gates:
                      #   bajo  = 1 crítico  × máx 1 iteración   (bajo 1/1)
                      #   medio = 1 crítico  × máx 1 iteración   (medio 1/1)
                      #   alto  = 2 críticos × máx 2 iteraciones + verificación adversarial (alto 2/2)
                      #   críticos/iteraciones — valores del perfil estandar de .spec/perfiles.yaml

perfil: ligero        # ligero | estandar | profundo — cuánto se gasta en producir la
                      # corrida (modelo/effort por rol, presupuesto del gate, exploradores).
                      # Eje independiente de `riesgo`. Fuente única: `.spec/perfiles.yaml`;
                      # `default: estandar` es fijo ahí. Se cambia con `/sdd-perfil <nombre>`.

modo_conversion: []   # Lista cronológica de conversiones de `modo` (CA-02). Toda
                      # unidad nace `modo: interactivo`; este campo es el único
                      # mecanismo por el que pasa a otro modo — una entrada por
                      # decisión humana de conversión, nunca editado retroactivamente.
# modo_conversion:
#   - desde: interactivo
#     hacia: semi-autonomo
#     en: "2026-09-24T10:00:00Z"
#     por: "Julian"
#     tras: research             # tras ∈ {research, spec} — fase en que se decidió
#   - desde: semi-autonomo
#     hacia: desatendido
#     en: "2026-09-24T11:00:00Z"
#     por: "Julian"
#     tras: spec
# Reglas:
#   - `desde` de cada entrada == `hacia` de la anterior; `interactivo` en la primera.
#   - `hacia` ∈ {semi-autonomo, supervisado, desatendido}.
#   - `hacia: desatendido` exige `mandato` (abajo) poblado con el id de un plan
#     maestro que liste esta unidad en su `## Unidades miembro`, y el paquete de
#     ese plan aprobado. El campo `tanda` que antes cumplía este papel está
#     retirado (2026-09-26): duplicaba con otro nombre lo que ya hace el plan
#     maestro. Ver AGENTS.md § Modo desatendido.
#   - Exención (CA-08): una unidad `modo: supervisado`, `mandato` poblado, SIN este
#     campo y `creado` anterior a 2026-09-24 conserva su modo hasta `fase: done`
#     sin regularizar — ver .spec/SUPERVISADO.md § Unidades en vuelo. Toda unidad
#     creada después de esa fecha nace `interactivo` y se convierte por esta lista,
#     aun bajo el mismo mandato.
#   - Validado por `.spec/scripts/validate_mode_conversion.py --unit <ruta>`.

# Decisión humana sobre el paquete de aprobación (solo modo semi-autonomo).
# `sdd-implementar` NO arranca en modo semi-autonomo sin decision: aprobado.
aprobacion_paquete:
  decision: aprobado
  fecha: "2026-09-29T11:35:00Z"
  nota: ""
# aprobacion_paquete:
#   decision: aprobado | aprobado-con-cambios | rechazado
#   fecha: "2026-05-22T10:00:00Z"
#   nota: "qué pidió cambiar, si aplica"

# --- Auditoría de modelo/effort (mecanismo propio de este repo; ver
# .spec/MODELO-AGENTES.md § Auditoría de modelo/effort para el porqué y la
# tabla completa). Qué subagente,
# modelo y effort ejecutó el contenido de cada fase. Quien invoca al
# subagente lo registra al terminar — no se infiere después, porque nadie
# más sabe con certeza qué se invocó de verdad.
modelo_ejecucion:
  especificar: {subagente: sdd-especificar-redactor, modelo: sonnet, effort: medium, perfil: ligero, en: "2026-09-29T05:55:00Z"}
  planificar: {subagente: sdd-planificar-redactor, modelo: haiku, effort: low, perfil: ligero, en: "2026-09-29T11:22:00Z"}
  tareas: {subagente: sdd-tareas-redactor, modelo: haiku, effort: low, perfil: ligero, en: "2026-09-29T11:25:37Z"}
  implementar:
    - {grupo: G1, subagente: sdd-implementador-low, modelo: sonnet, effort: low, perfil: ligero, complejidad: estandar, en: "2026-09-29T11:44:56Z"}
# modelo_ejecucion:
#   research:                   # fase 0 opcional (CA-10) — dos sub-entradas, cada
#                                # una con `modelo` y `perfil`.
#     exploradores: {subagente: sdd-explorador, modelo: sonnet, effort: medium, perfil: estandar, instancias: 3, en: "2026-05-22T09:00:00Z"}
#     consolidacion: {subagente: inline, modelo: sonnet, perfil: estandar, en: "2026-05-22T09:30:00Z"}
#                                # consolidacion corre inline (subagente: "inline"),
#                                # en el modelo de la sesión que conduce, no en un
#                                # subagente propio (H15).
#   especificar: {subagente: sdd-especificar-redactor, modelo: sonnet, effort: high, perfil: estandar, en: "2026-05-22T10:00:00Z"}
#   planificar:  {subagente: sdd-planificar-redactor,  modelo: sonnet, effort: high, perfil: estandar, en: "2026-05-22T11:00:00Z"}
#   tareas:      {subagente: sdd-tareas-redactor,      modelo: haiku, perfil: estandar, en: "2026-05-22T11:30:00Z"}
#   implementar:                # una entrada por grupo del plan
#     - {grupo: G1, subagente: sdd-implementador,        modelo: sonnet, effort: high,  perfil: estandar, complejidad: estandar}
#     - {grupo: G2, subagente: sdd-implementador-xhigh,  modelo: sonnet, effort: xhigh, perfil: estandar, complejidad: complejo}

# Veredicto de cada gate ejecutado; una clave por fase evaluada
# (spec | plan | tasks | codigo). Contrato:
#   veredicto ∈ {aprobado, refinado, escalado}
#   causa: solo si veredicto=escalado — sin-gobernanza | decision-humana |
#          hallazgos-sin-resolver | validacion-en-rojo | determinista-irresoluble |
#          sin-convergencia
#   iteraciones: entero
#   hallazgos: lista de objetos {severidad, lente, donde, problema, correccion}
#              — SOLO los que quedaron sin resolver
#   hallazgos_resueltos: entero — cuántos se corrigieron (alimenta el paquete)
#   governance_consultada ∈ {si, parcial, no}
#   criticos: qué subagente/modelo evaluó cada lente (auditoría, igual que
#             modelo_ejecucion arriba — mismo mecanismo propio)
#   refutador: igual, solo presente si corrió verificación adversarial (tier alto)
#   rehabilitado_por: opcional, en gates.<fase> — decisión humana registrada para
#             re-correr un gate cuyo último veredicto fue `escalado` sobre la
#             misma fase, SIN reiniciar `iteraciones`: {por, en, motivo}
# El detalle narrativo (qué criticó cada lente, qué se descartó) va en bitacora.md.
gates:
  spec:
    veredicto: refinado
    tier: bajo
    iteraciones: 1
    fs_hash: "90ad651260fa4f2ad9d9fdc1001927a59c53a57a828a161ce3542329d093cec9"
    hallazgos:
      - severidad: baja
        lente: L1 — Testeabilidad
        donde: "spec.md:91 (CA-04)"
        problema: "Aserción compuesta (positiva + negativa) — si una mitad pasa y la otra no, no se sabe cuál falló sin reinspeccionar."
        correccion: "Partir en CA-04a (positiva) y CA-04b (negativa). No se aplica en esta iteración (severidad baja, no bloquea); queda como mejora opcional para una unidad posterior."
    hallazgos_resueltos: 2
    governance_consultada: si
    governance_nota: "centinela [ninguna-aplicable] confirmado por el crítico L4 con evidencia del repo: AGENTS.md raíz se autodefine como prosa para el destino, .mcp.json raíz apunta a launcher del destino, scripts/mcp-pce.sh reitera que la fuente de .env es el destino. Sin superficie de gobernanza local recuperable."
    criticos:
      - {lente: "L1 — Testeabilidad", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
      - {lente: "L4 — Gobernanza", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
  plan:
    veredicto: aprobado
    tier: bajo
    iteraciones: 1
    fs_hash: "90ad651260fa4f2ad9d9fdc1001927a59c53a57a828a161ce3542329d093cec9"
    hallazgos: []
    hallazgos_resueltos: 0
    governance_consultada: si
    governance_nota: "mismo centinela [ninguna-aplicable] confirmado en spec; el plan no introduce superficie de gobernanza. Trazabilidad CA-NN→plan completa: 8/8 CA cubiertos por comandos literales en plan.md:48,:63 y decisión justificada en :28."
    criticos:
      - {lente: "L1 — Reutilización", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
      - {lente: "L4 — Gobernanza y coherencia con el spec", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
  tasks:
    veredicto: aprobado
    tier: bajo
    iteraciones: 1
    fs_hash: "90ad651260fa4f2ad9d9fdc1001927a59c53a57a828a161ce3542329d093cec9"
    hallazgos: []
    hallazgos_resueltos: 0
    governance_consultada: si
    governance_nota: "centinela [ninguna-aplicable] confirmado en spec/plan; tareas T1..T8 cubren exactamente el G1 único del plan (2 líneas en `.gitignore` + 6 verificaciones atómicas CA-01..CA-08) sin deriva. Cobertura verificada en capa determinista: 8/8 CA-NN del spec presentes en tareas."
    criticos:
      - {lente: "L1 — Atomicidad y verificabilidad", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
      - {lente: "L3 — Fidelidad al plan", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
  codigo:
    veredicto: aprobado
    tier: bajo
    iteraciones: 1
    fs_hash: "90ad651260fa4f2ad9d9fdc1001927a59c53a57a828a161ce3542329d093cec9"
    hallazgos:
      - severidad: media
        lente: "L1 — Cumplimiento de los CA-NN (grieta del spec, no del código)"
        donde: "spec.md:95 (CA-08)"
        problema: "Tensión documentada: spec § Governance aplicable (líneas 97-114) declara que pce-mcp no se ejecuta contra el repo del kit, pero CA-08 exige que `python3 scripts/kit_doctor.py` termine con exit code 0 — lo que presupone pce-mcp operativo en el repo del kit, contradicción con la misma prosa del spec. Verificado con `git stash` que la falla es preexistente (exit=2 con y sin el cambio de `.gitignore`); falla atribuible al entorno agéntico del repo, no al cambio de la unidad."
        correccion: "Una unidad posterior debe revisar el spec: o relajar CA-08 (e.g., exit 0 OR falla documentada de pce-mcp/graph-index documentada como ambiental), o quitar la tensión entre § Governance aplicable y CA-08. Esta unidad no puede cerrar la grieta sin salirse de su propio alcance."
      - severidad: baja
        lente: "L1 — Cumplimiento de los CA-NN (defecto del comando de verificación)"
        donde: "spec.md:92 (bucle bash de CA-05)"
        problema: "El bucle bash literal del spec es frágil a la expansión de pathnames en shells con globbing activo (zsh por defecto). El patrón `.spec/scripts/**/__pycache__/` se expande al directorio real `.spec/scripts/tests/__pycache__/` y `grep -F` lo busca como literal — falla el CA aunque el patrón está en `.gitignore:64`. El implementador lo ejecutó OK con `set -f` (per bitacora.md)."
        correccion: "Una unidad posterior puede añadir quoting al bucle (`set -f` al inicio o `shopt -s -o noglob` según shell) o usar `git check-ignore --no-index` con un path dummy que matchee el patrón. Esta unidad ejecutó OK; el hallazgo es sobre la robustez del comando del spec, no del cambio."
    hallazgos_resueltos: 0
    governance_consultada: si
    governance_nota: "centinela [ninguna-aplicable] confirmado por el crítico L3. L1 confirmó cumplimiento de los 7 CA-NN atribuibles al cambio (CA-01..CA-07); CA-08 marcado como cumplido-en-ambiente con justificación (falla preexistente, no introducida por la unidad). L2 sin hallazgos (cambio estrictamente aditivo, sin lógica). L3 sin hallazgos de duplicación ni de estilo."
    criticos:
      - {lente: "L1 — Cumplimiento de los CA-NN", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
      - {lente: "L2 — Correctitud", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
      - {lente: "L3 — Encaje con el repo y gobernanza", subagente: general, modelo: sonnet, effort: low, perfil: ligero}
