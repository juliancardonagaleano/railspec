# --- Modo supervisado ---
# Ver .spec/_plantillas/plan-maestro.md, .spec/_plantillas/mandato.md y
# .spec/SUPERVISADO.md. Los defaults de una unidad v1 (modo=interactivo,
# riesgo=medio, gates={}) no cambian por este bloque.

mandato: ""            # Un solo campo, un solo valor escalar: el id de un
                        # plan (.spec/planes/<id>/) o la ruta relativa al
                        # archivo de mandato de esta unidad (p.ej.
                        # mandato.md, dentro de este mismo directorio).
                        # Solo tiene sentido junto con `modo: supervisado`.
                        # Comentario de gobierno del campo: solo la
                        # orquestación de `sdd-supervisado` lo sustituye, y
                        # solo al iniciar un plan aprobado — nadie más lo
                        # edita a mano.

validaciones_mandato: []   # Comentado, junto a `gates`: lista de
                            # {fecha, fase, exit, codigos} — una entrada por
                            # corrida de `validate_mandate.py` sobre esta
                            # unidad o su plan. Lo escribe `sdd-supervisado`.
# validaciones_mandato:
#   - {fecha: "2026-09-17T16:00:00Z", fase: implement, exit: 0, codigos: []}
