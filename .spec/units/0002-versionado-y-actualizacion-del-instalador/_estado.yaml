#       - {lente: "L1 — Testeabilidad", subagente: sdd-critico-profundo, modelo: sonnet, effort: high, perfil: estandar}
#       - {lente: "L4 — Gobernanza",    subagente: sdd-critico-profundo, modelo: sonnet, effort: high, perfil: estandar}
