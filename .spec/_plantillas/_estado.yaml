# Estado machine-readable de la unidad de trabajo. Fuente de verdad para la retoma.
# Comentarios inline solo aclaran lo que NO está en .spec/README.md § Los cuatro modos /
# § concurrencia / § Gates de validación. Cualquier detalle narrativo vive en bitacora.md.
id: NNNN-slug
titulo: ""

# --- Multi-colaborador — ver .spec/README.md § concurrencia. ---
dueño: ""             # quien creó la unidad o a quien se le asignó explícitamente.
carril: ""            # core | orchestrator | studio | sdd (protocolo); ver .spec/README.md § Ejecución multi-agente.

fase: spec            # research | spec | plan | tasks | aprobacion | implement | done
estado: en-progreso   # en-progreso | bloqueado | completado
creado: ""            # ISO-8601, p.ej. 2026-05-22T10:00:00Z
actualizado: ""       # ISO-8601 — actualizar al cerrar cada sesión
governance_refs: []   # ids de ADR/policy/principio aplicables; [] sin justificar rechaza el gate del spec.
                      # [ninguna-aplicable] = no aplica ninguno (con justificación en la tabla del spec).
comando_validacion: "" # comando que verifica esta unidad (p.ej. build/typecheck/validate del repo)

# --- SDD v2 — Semántica de `modo`, `riesgo`, `perfil` en .spec/README.md § Los cuatro modos / § Gates de validación. ---
modo: interactivo     # interactivo | semi-autonomo | supervisado | desatendido
riesgo: medio         # bajo | medio | alto — dimensiona el panel del gate.
perfil: estandar      # ligero | estandar | profundo — fuente única .spec/perfiles.yaml.

modo_conversion: []   # Lista cronológica de conversiones de `modo` — ver .spec/README.md § concurrencia.
                      # Toda unidad nace `modo: interactivo`; este campo es el único mecanismo de conversión.
                      # Validado por .spec/scripts/validate_mode_conversion.py --unit <ruta>.

aprobacion_paquete: {} # Decisión humana sobre el paquete (solo modo semi-autonomo).
                       # `sdd-implementar` NO arranca sin decision: aprobado.

modelo_ejecucion: {}   # Qué subagente/modelo/effort corrió cada fase — ver .spec/README.md § Ejecución multi-agente → § Auditoría de modelo/effort.

gates: {}             # Veredicto de cada gate ejecutado; una clave por fase (spec | plan | tasks | codigo).
                      # Contrato completo (veredicto, causa, iteraciones, hallazgos, criticos, refutador,
                      # rehabilitado_por) en .spec/README.md § Gates de validación.

depende_de: []        # Block-list de IDs de unidades de las que esta depende (ver .spec/README.md § concurrencia).

# --- Modo supervisado — ver .spec/SUPERVISADO.md y .spec/README.md § Modo supervisado. ---
mandato: ""            # Ruta al mandato (`mandato.md`/`plan.md` dentro de la propia unidad) o vacío. Ver .spec/SUPERVISADO.md.

validaciones_mandato: []   # Lista de {fecha, fase, exit, codigos} — una entrada por corrida de `validate_mandate.py`.
                            # Lo escribe `sdd-supervisado`. Validación de contrato con `.spec/scripts/validate_mandate.py`.