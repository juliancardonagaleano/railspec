# Configuración de datos de este mismo repositorio, como destino de su
# propio motor (el kit corre su propio protocolo SDD sobre sí mismo en
# modo bootstrap — ver `.spec/units/`). Mismo contrato de precedencia que
# usa `.spec/scripts/preflight.py` (`resolve_mcp_config`) para el MCP:
# flag explícito de línea de comandos > variable de entorno
# `SDD_PROTOCOLO_DATOS_PATH` > este archivo, resuelto relativo a la raíz de
# este repositorio. Un destino sin este archivo no tiene configuración de
# datos — el motor del kit falla explícito, no cae a un default silencioso.

# Modelos/perfiles permitidos en la prosa de `.agents/skills/*/SKILL.md` y en
# `.spec/perfiles.yaml` de este repositorio (checks 10 y 11 del validador de
# deriva de protocolo — `.spec/scripts/validate_protocol_drift.py`).
modelos_permitidos:
  - opus
  - sonnet
  - haiku

perfiles_permitidos:
  - ligero
  - estandar
  - profundo

# Subárboles de test que resuelve `test_subset.py` — selector de subset de
# pruebas por archivo tocado. Este repositorio solo tiene un árbol Python
# testable propio (no hay equivalente a los `orchestrator/`/`studio/app/` de
# un monorepo de aplicación): el andamiaje del kit y el instalador.
subarboles_test:
  - ruta: .spec/scripts/
    runner: pytest
    comando_completo: cd .spec/scripts && python3 -m pytest tests
  - ruta: installer/
    runner: pytest
    comando_completo: python3 -m pytest installer/tests
